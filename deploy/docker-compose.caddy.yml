# Alternative front: Caddy with automatic HTTPS (ACME). Use instead of docker-compose.yml.
#   docker compose -f docker-compose.caddy.yml up -d
name: repocuck
services:
  app:
    image: ${REPOCUCK_IMAGE:-ghcr.io/example/repocuck:1.0.0}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 2g
    expose: ["8080"]
    networks: [internal]
    environment:
      ConnectionStrings__Postgres: Host=db;Database=repocuck;Username=repocuck;Password=${DB_PASSWORD}
      REPOCUCK__BASE_URL: ${REPOCUCK_BASE_URL}
      Security__PublicScheme: https
      Security__TrustedProxies: 172.30.0.0/24
      Security__ClientIpHeader: X-Forwarded-For
      Bootstrap__AdminUsername: admin
      Bootstrap__AdminPasswordFile: /run/secrets/admin_password
      Apt__SigningKeyPassphraseFile: /run/secrets/gpg_passphrase
      GitHub__Token: ${GITHUB_TOKEN:-}
    volumes:
      - repocuck-data:/data
      - ./secrets/admin_password:/run/secrets/admin_password:ro
      - ./secrets/gpg_passphrase:/run/secrets/gpg_passphrase:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: repocuck
      POSTGRES_USER: repocuck
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repocuck"]
      interval: 10s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    networks: [internal]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
networks:
  internal:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
volumes:
  repocuck-data:
  pgdata:
  caddy-data:
  caddy-config:
