name: rce2e
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: repocuck, POSTGRES_USER: repocuck, POSTGRES_PASSWORD: e2e }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U repocuck"], interval: 2s, retries: 30 }
  fakegh:
    image: python:3.11-slim
    command: ["python", "/fake_github.py"]
    volumes:
      - ./fake_github.py:/fake_github.py:ro
      - ./fixture:/fixture
  app:
    image: repocuck:dev
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports: ["18080:8080"]
    depends_on: { db: { condition: service_healthy }, fakegh: { condition: service_started } }
    environment:
      ConnectionStrings__Postgres: Host=db;Database=repocuck;Username=repocuck;Password=e2e
      REPOCUCK__BASE_URL: http://app:8080
      Security__PublicScheme: http
      GitHub__ApiBaseUrl: http://fakegh:8000
      GitHub__AllowInsecureForTesting: "true"
      Bootstrap__AdminUsername: admin
      Bootstrap__AdminPasswordFile: /run/secrets/admin_pw
      Apt__EnableTesting: "true"
      Limits__RequestsPerHour: "100"
      Limits__LoginAttemptsPer5MinutesPerIp: "1000"
      Jobs__WorkerConcurrency: "2"
    volumes:
      - appdata:/data
      - ./admin_pw:/run/secrets/admin_pw:ro
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"], interval: 2s, retries: 60 }
volumes:
  appdata:
